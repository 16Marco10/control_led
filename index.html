<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de LEDs Arduino</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>Control de LEDs Arduino</h1>

    <button id="btnConectar">Conectar Arduino</button>
    <p id="estado">Arduino desconectado</p>

    <h2>Control general</h2>
    <button id="btnTodosOn" disabled>Encender todos</button>
    <button id="btnTodosOff" disabled>Apagar todos</button>

    <h2>LED azul</h2>
    <button id="btnAzulOn" disabled>Encender azul</button>
    <button id="btnAzulOff" disabled>Apagar azul</button>

    <h2>LED rojo</h2>
    <button id="btnRojoOn" disabled>Encender rojo</button>
    <button id="btnRojoOff" disabled>Apagar rojo</button>

    <script src="script.js"></script>
</body>
</html>
